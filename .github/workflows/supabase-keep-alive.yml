name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 9 * * *"  # diário ~06:17 BRT; minuto quebrado reduz atraso de fila do GitHub
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://zocllfbityzgmjhkiizt.supabase.co
  PROJECT_REF: zocllfbityzgmjhkiizt

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (query real no Postgres)
        id: ping
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY vazio — verifique os Secrets do repositório."
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP $STATUS"
          echo "Body: $BODY"

          if [ "$STATUS" = "200" ]; then
            echo "Projeto ativo — banco respondeu."
            exit 0
          fi

          if [ "$STATUS" = "000" ]; then
            echo "Projeto aparenta estar pausado (DNS não resolve). Tentando auto-restore."
            echo "paused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Status inesperado ($STATUS). 401=key inválida."
          exit 1

      - name: Auto-restore via Management API
        if: steps.ping.outputs.paused == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Projeto pausado e SUPABASE_ACCESS_TOKEN ausente. Restaure manualmente no dashboard e adicione o secret (supabase.com/dashboard/account/tokens)."
            exit 1
          fi

          RESTORE_STATUS=$(curl -s -o /tmp/restore-body -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore")
          echo "Restore HTTP $RESTORE_STATUS"
          cat /tmp/restore-body

          if [ "$RESTORE_STATUS" != "201" ] && [ "$RESTORE_STATUS" != "200" ] && [ "$RESTORE_STATUS" != "204" ]; then
            echo "::error::Falha ao solicitar restore (HTTP $RESTORE_STATUS)."
            exit 1
          fi

          echo "Restore solicitado. Aguardando o projeto subir (até ~7 min)..."
          for i in $(seq 1 20); do
            sleep 20
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/products?select=id&limit=1")
            echo "Tentativa $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Projeto restaurado e banco respondendo."
              exit 0
            fi
          done

          echo "::error::Restore solicitado mas o banco não respondeu 200 em ~7 min. Verificar dashboard."
          exit 1

  keep-cron-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit dummy se o repo estiver parado há 40+ dias
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Último commit há $AGE_DAYS dia(s)."

          if [ "$AGE_DAYS" -lt 40 ]; then
            echo "Repo ativo — nada a fazer (GitHub desativa crons após 60 dias sem commits)."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive — evita desativação do cron (60 dias sem commits)"
          git push
