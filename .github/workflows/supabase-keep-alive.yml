name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 12 * * 1,4"  # toda segunda e quinta ao meio-dia UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://zocllfbityzgmjhkiizt.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY vazio — verifique os Secrets do repositório."
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP $STATUS"
          echo "Body: $BODY"

          if [ "$STATUS" = "200" ]; then
            echo "Projeto ativo — banco respondeu."
            exit 0
          fi

          echo "::error::Status inesperado ($STATUS). 401=key inválida, 000=projeto pausado."
          exit 1
